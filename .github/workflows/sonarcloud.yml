name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  # A push to main is the run that publishes coverage; superseded runs there would never finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonarcloud:
    # Pin the last proven working reusable workflow. Following @main caused a
    # no-jobs workflow failure after an upstream change (CI run 42674506192).
    # Upgrade deliberately after validating the newer shared revision.
    uses: storytold/craft-common-actions/.github/workflows/sonarcloud.yml@8e9b8b96c5d64c54eba462f5e8cac196787e744d # last confirmed working shared revision
    with:
      timeout-minutes: 120
      fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
    secrets: inherit
