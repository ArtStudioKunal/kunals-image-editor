name: Build KimagePro (Windows)

on:
  workflow_dispatch:

jobs:
  windows-app:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - name: Prepare Windows icon from KimagePro artwork
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          @'
          from PIL import Image
          from pathlib import Path
          source = Path("assets/app-icon/kimagepro.png")
          image = Image.open(source).convert("RGBA")
          image.save("assets/app-icon/photocraft.ico", format="ICO",
                     sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
      - name: Build release application
        shell: pwsh
        run: cargo build --release --locked -p photocraft
      - name: Package branded executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Copy-Item target/release/photocraft.exe output/KimagePro.exe
          Copy-Item LICENSE-MIT,LICENSE-APACHE,NOTICE,ATTRIBUTION.md output/
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: KimagePro-Windows-x64
          path: output/
          if-no-files-found: error
